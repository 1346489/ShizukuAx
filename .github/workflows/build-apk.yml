name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验工程完整性
        run: python3 ci-verify.py

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/AxShizuku-debug.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90

      - name: 汇总
        run: |
          echo "## 构建产物" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/AxShizuku-debug.apk >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 后端：Shizuku / KernelSU / Magisk" >> $GITHUB_STEP_SUMMARY
          echo "- 功能：冻结 / 启用 / 清数据 / 卸载 / 批量多选 / Profile" >> $GITHUB_STEP_SUMMARY
          echo "- 安全：防误冻白名单 + 二次确认" >> $GITHUB_STEP_SUMMARY
