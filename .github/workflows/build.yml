name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 补齐 Wrapper 与签名
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: 构建并抓取真实错误
        id: build
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true
          echo "===== 真实编译错误（找第一个 ERROR/FAILURE/Unresolved/cannot find） ====="
          grep -E "ERROR|FAILED|Unresolved|cannot find|error:|Exception" build.log | head -20 || true
          echo "===== 构建输出尾部 ====="
          tail -30 build.log
          # 若真失败则让步骤标红
          if grep -q "BUILD FAILED" build.log; then exit 1; fi
      - name: 重命名与上传
        if: success()
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
