name: Build AxShizuku
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/me/x/shizukuax app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable app/src/main/assets/web gradle/wrapper
          cat > settings.gradle.kts <<'K'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ShizukuAx"
          include(":app")
          K
          cat > build.gradle.kts <<'K'
          plugins {
            id("com.android.application") version "8.2.2" apply false
            id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          K
          cat > gradle.properties <<'K'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          K
          cat > app/build.gradle.kts <<'K'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "me.x.shizukuax"
            compileSdk = 34
            defaultConfig { applicationId = "me.x.shizukuax"; minSdk = 26; targetSdk = 34; versionCode=1; versionName="1.0.0" }
            buildFeatures { viewBinding = true }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
            implementation("dev.rikka.shizuku:api:13.1.5")
            implementation("androidx.webkit:webkit:1.10.0")
            implementation("androidx.core:core-ktx:1.12.0")
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.11.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
            implementation("org.json:json:20231013")
          }
          K
          echo "（为控制长度，CI内继续写源码文件，见下条消息分块）"
      - name: Build
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ax"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew clean assembleDebug --no-daemon || gradle wrapper --gradle-version 8.5 && ./gradlew clean assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
