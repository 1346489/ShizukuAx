name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { api-level: 34, build-tools: 34.0.0 }
      - name: gen
        run: bash gen.sh
      - name: keystore
        run: keytool -genkey -v -keystore debug.keystore -alias a -storepass a -keypass a -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=x"
      - name: build
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties && chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: AxShizuku, path: app/build/outputs/apk/debug/app-debug.apk, retention-days: 90 }
