name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 纯手动安装 Gradle 8.5 (彻底绕开仓库残缺的 wrapper)
        run: |
          cd /opt
          curl -L -o gradle-8.5-bin.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          rm -f gradle-8.5-bin.zip
          echo "GRADLE_HOME=/opt/gradle-8.5" >> $GITHUB_ENV
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          # 暴力清理仓库里可能残缺的 wrapper，强制后续只用系统 gradle 命令
          rm -rf gradle/wrapper gradle gradlew gradlew.bat
          mkdir -p app
          # 生成调试签名防签名报错
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" || true

      - name: 验证 Gradle 并构建 APK
        run: |
          which gradle
          gradle --version
          # 绝对路径硬编，绝不碰 ./gradlew
          /opt/gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true
          echo "===== 真实编译错误（找第一个 ERROR/FAILURE/Unresolved/cannot find） ====="
          grep -E "ERROR|FAILED|Unresolved|cannot find|error:|Exception" build.log | head -20 || true
          echo "===== 构建输出尾部 ====="
          tail -30 build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: 重命名产物
        if: success()
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
