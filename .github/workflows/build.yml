name: Build AxShizuku APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Android SDK（规避已下架的 tools 包）
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          packages: platform-tools,platforms;android-34,extras;android;m2repository
        continue-on-error: true

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: 兜底补装 cmdline-tools（若上一步未成功）
        run: |
          if ! command -v sdkmanager >/dev/null 2>&1; then
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -qo /tmp/cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
            mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest 2>/dev/null || true
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi
          sdkmanager --version || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true

      - name: 生成工程源码
        run: bash gen.sh

      - name: 生成 debug 签名
        run: keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AxShizuku"

      - name: 写 local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 编译 Debug APK
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AxShizuku-debug.apk
          ls -lh out/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: out/AxShizuku-debug.apk
          retention-days: 90
