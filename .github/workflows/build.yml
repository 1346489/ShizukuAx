name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 纯手动安装 Gradle 8.5（绕开仓库残缺 wrapper）
        run: |
          cd /opt
          if [ ! -d g8 ]; then
            curl -L -o g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q g.zip && rm -f g.zip && mv gradle-8.5 g8
          fi
          echo "/opt/g8/bin" >> $GITHUB_PATH
          rm -rf gradle/wrapper gradlew gradlew.bat gradle
          mkdir -p app
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey             -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Debug,O=Android,C=US" || true

      - name: 构建 APK（绝对路径硬编）
        run: |
          which gradle || true
          /opt/g8/bin/gradle --version
          /opt/g8/bin/gradle clean assembleDebug --no-daemon --stacktrace > build.log 2>&1 || true
          if grep -q "BUILD FAILED" build.log; then
            echo "===== [1] Kotlin/资源 真实报错 ====="
            grep -nE "^e: |error: |ERROR:|FAILED|Unresolved|cannot find|not found|link" build.log | head -40 || true
            echo "===== [2] 失败任务上下文 ====="
            grep -B 6 -A 25 "processDebugMainManifest FAILED|processDebugResources FAILED|compileDebugKotlin FAILED|BUILD FAILED" build.log | head -160 || true
            tail -20 build.log
            exit 1
          fi

      - name: 重命名产物
        if: success()
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk              app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
