name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 纯手动安装 Gradle 8.5
        run: |
          cd /opt
          if [ ! -d gradle-8.5 ]; then
            curl -L -o g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
            unzip -q g.zip && rm -f g.zip
          fi
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          rm -rf gradle/wrapper gradlew gradlew.bat
          mkdir -p app
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" || true

      - name: 构建并抓取真实错误
        run: |
          which gradle && gradle --version
          /opt/gradle-8.5/bin/gradle clean assembleDebug --no-daemon --stacktrace > build.log 2>&1 || true
          echo "===== [1] Kotlin 真实报错(e: 行) ====="
          grep -nE "^e: |error: |w: " build.log | head -30 || true
          echo "===== [2] 失败任务名 ====="
          grep -nE "FAILED|BUILD FAILED|:app:compile" build.log | head -10 || true
          echo "===== [3] 失败前上下文 ====="
          grep -B 8 -A 25 "BUILD FAILED\|:app:compileDebugKotlin FAILED" build.log | head -120 || true
          echo "===== [4] 尾部 ====="
          tail -15 build.log
          if grep -q "BUILD FAILED" build.log; then exit 1; fi

      - name: 重命名产物
        if: success()
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
