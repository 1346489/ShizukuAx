name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 JDK 17 与 安装系统级 Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # 关键：直接让 CI 装好 Gradle 8.5，彻底不用仓库里残缺的 ./gradlew
          gradle-version: '8.5'

      - name: 生成调试签名 (防签名报错)
        run: |
          mkdir -p app
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"

      - name: 赋予权限并构建 APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          # 关键：优先用系统装的 gradle 命令硬编；若失败再用本地 gradlew
          gradle assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名产物
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true
          
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
