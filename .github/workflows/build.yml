name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 纯手动安装 Gradle 8.5
        run: |
          cd /opt
          curl -L -o g.zip https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q g.zip && rm -f g.zip && mv gradle-8.5 g8
          echo "/opt/g8/bin" >> $GITHUB_PATH
          rm -rf gradle/wrapper gradlew gradlew.bat
          mkdir -p app
          keytool -genkeypair -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US" || true
      - name: 构建 APK
        run: |
          /opt/g8/bin/gradle clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || true
          if grep -q "BUILD FAILED" build.log; then
             grep -nE "e: |error: |FAILED|Unresolved" build.log | head -20 || true
             exit 1
          fi
      - name: 重命名产物
        if: success()
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true
      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
