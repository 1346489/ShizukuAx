name: build
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验工程完整性
        run: ls -R
      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew 2>/dev/null || true
      
      # ⚠️ 新增：自动补齐缺失的 gradle wrapper 二进制（根治 ClassNotFound）
      - name: 补齐 Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi
          cat > gradle/wrapper/gradle-wrapper.properties <<'P'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          P
          chmod +x gradlew
      
      - name: 构建 debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: 重命名产物
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AxShizuku-debug.apk 2>/dev/null || true
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AxShizuku-debug
          path: app/build/outputs/apk/debug/AxShizuku-debug.apk
          retention-days: 90
